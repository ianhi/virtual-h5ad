[project]
name = "virtual-h5ad"
version = "0.1.0"
description = "Reference a collection of h5ad/AnnData files as one virtual sparse matrix in Icechunk — no copying"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "anndata>=0.12.17",
    "h5py>=3.16.0",
    "icechunk>=2.0.6",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "obstore>=0.10.1",
    "scanpy>=1.12.1",
    "scipy>=1.17.1",
    "virtualizarr[hdf,icechunk]>=2.6.2",
    "xarray>=2026.4.0",
]

[dependency-groups]
dev = [
    "coiled>=1.135.1",
    "ipykernel>=7.3.0",
    "jupyter-collaboration>=4.4.1",
    "jupyterlab>=4.5.9",
]
# latency_benchmark.py drives the shared snailmail HTTPRangeServer (injectable
# latency + bandwidth). Not a hand-rolled server.
bench = ["snailmail>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_h5ad"]
